name: Build PBackup
 
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
 
      - name: Zainstaluj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Zbuduj plugin (Maven)
        run: mvn -B -ntp clean package
 
      - name: Sprawdź zawartość JAR-a
        run: |
          echo "=== Pliki w JAR ==="
          unzip -l target/PBackup.jar
          echo "=== plugin.yml ==="
          unzip -p target/PBackup.jar plugin.yml
          echo "=== Wersja bytecode klasy głównej (65 = Java 21) ==="
          javap -v -cp target/PBackup.jar pl.pbackup.PBackup | grep "major version"
          unzip -l target/PBackup.jar | grep -q "plugin.yml" || (echo "BRAK plugin.yml w JAR" && exit 1)
          unzip -l target/PBackup.jar | grep -q "pl/pbackup/PBackup.class" || (echo "BRAK klasy głównej w JAR" && exit 1)
          unzip -l target/PBackup.jar | grep -q "config.yml" || (echo "BRAK config.yml w JAR" && exit 1)
 
      - name: Wyślij JAR jako artefakt (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PBackup
          path: target/PBackup.jar
          if-no-files-found: error
 
      - name: Opublikuj JAR w Releases (bezpośrednie pobranie, bez zipa)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PBackup build ${{ github.run_number }}
          files: target/PBackup.jar
          generate_release_notes: true
